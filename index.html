<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151e35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>局域网文件传输</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f19;
      --top-bg: #151e35;
      --card: rgba(22, 28, 45, .82);
      --card-mobile: #151b2c;
      --border: rgba(255,255,255,.09);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; }
    html {
      min-height: 100%;
      background-color: var(--top-bg);
      background-image: linear-gradient(180deg, var(--top-bg) 0, #0f1525 44%, var(--bg) 100%);
      background-repeat: no-repeat;
      background-size: 100% 100vh;
      background-size: 100% 100svh;
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
      overscroll-behavior-y: none;
      overflow-x: hidden;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(36px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(36px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      position: relative;
      isolation: isolate;
      background: var(--top-bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      min-height: 100%;
      background: radial-gradient(ellipse 110% 48% at 50% 0, var(--top-bg) 0, #11182a 48%, var(--bg) 100%);
      pointer-events: none;
    }
    body::after {
      content: "";
      position: fixed;
      top: calc(0px - env(safe-area-inset-top, 0px));
      right: 0;
      left: 0;
      z-index: 0;
      height: calc(env(safe-area-inset-top, 0px) + env(safe-area-inset-top, 0px));
      background: var(--top-bg);
      pointer-events: none;
    }
    .container { position: relative; width: min(820px, 100%); margin: 0 auto; display: grid; gap: 22px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    h1 { margin: 0; font-size: clamp(1.25rem, 4vw, 1.65rem); }
    h1 span { color: var(--accent); }
    .badge {
      max-width: 58%; padding: 7px 12px; overflow: hidden; border-radius: 999px;
      background: rgba(59,130,246,.12); color: #7db0ff; font-size: .82rem;
      font-weight: 650; text-overflow: ellipsis; white-space: nowrap;
      border: 1px solid transparent;
    }
    button.badge {
      min-height: 36px; cursor: copy; text-align: left;
    }
    button.badge:hover, button.badge:focus-visible {
      border-color: rgba(125,176,255,.45); background: rgba(59,130,246,.18);
    }
    .card {
      padding: 24px; border: 1px solid var(--border); border-radius: 16px;
      background: var(--card); box-shadow: 0 16px 48px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
    }
    .drop-zone {
      padding: 38px 20px; border: 2px dashed rgba(255,255,255,.16);
      border-radius: 12px; text-align: center; cursor: pointer; transition: .18s ease;
      touch-action: manipulation; user-select: none; -webkit-user-select: none;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent); background: rgba(59,130,246,.07);
    }
    .drop-zone input { display: none; }
    .upload-icon { margin-bottom: 10px; font-size: 2.7rem; }
    .upload-title { font-weight: 700; }
    .upload-desc { margin-top: 7px; color: var(--muted); font-size: .86rem; }
    .progress { display: none; margin-top: 18px; }
    .progress-copy { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: .84rem; }
    .progress-copy span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track { height: 7px; margin-top: 7px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.08); }
    .fill { width: 0; height: 100%; background: var(--accent); transition: width .1s linear; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .card-title { font-weight: 700; }
    button, .button {
      min-height: 42px; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer;
      color: white; font: inherit; font-size: .84rem; font-weight: 650; text-decoration: none;
      touch-action: manipulation;
    }
    button:focus-visible, .button:focus-visible, .drop-zone:focus-visible {
      outline: 3px solid rgba(96,165,250,.55); outline-offset: 2px;
    }
    button:disabled { cursor: wait; opacity: .55; }
    .refresh { min-height: 42px; padding: 6px 8px; background: transparent; color: var(--muted); }
    .refresh:hover { color: var(--text); }
    .file-list { display: grid; gap: 9px; }
    .file-item {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 13px 15px; border: 1px solid var(--border); border-radius: 10px;
      background: rgba(255,255,255,.025);
    }
    .file-info { min-width: 0; display: flex; align-items: center; gap: 12px; }
    .file-icon { flex: 0 0 auto; font-size: 1.55rem; }
    .file-details { min-width: 0; }
    .file-name { display: block; overflow: hidden; font-size: .93rem; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .file-meta { margin-top: 3px; color: var(--muted); font-size: .73rem; }
    .actions { flex: 0 0 auto; display: flex; gap: 7px; }
    .primary { background: var(--accent); }
    .primary:hover { background: var(--accent-hover); }
    .danger { background: rgba(239,68,68,.12); color: #ff7777; }
    .danger:hover { background: var(--danger); color: white; }
    .empty, .error { padding: 34px 15px; color: var(--muted); text-align: center; font-size: .88rem; }
    .error { color: #ff8b8b; }
    @media (max-width: 560px) {
      body {
        padding: calc(18px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
      }
      body::before { background: linear-gradient(180deg, var(--top-bg) 0, #0f1525 42%, var(--bg) 100%); }
      .container { gap: 14px; }
      header { align-items: stretch; flex-direction: column; gap: 9px; padding: 0 3px; }
      h1 { font-size: 1.35rem; }
      .badge {
        max-width: 100%; width: 100%; padding: 9px 11px; border-radius: 9px;
        font-size: .8rem; white-space: normal; overflow-wrap: anywhere; text-align: center;
      }
      button.badge { min-height: 44px; }
      .card {
        padding: 14px; border-radius: 13px; background: var(--card-mobile);
        box-shadow: 0 10px 28px rgba(0,0,0,.24);
        -webkit-backdrop-filter: none; backdrop-filter: none;
      }
      .drop-zone { min-height: 156px; padding: 24px 13px; display: grid; place-content: center; }
      .upload-icon { margin-bottom: 7px; font-size: 2.35rem; }
      .upload-title { font-size: .98rem; }
      .upload-desc { margin-top: 5px; line-height: 1.45; }
      .progress { margin-top: 14px; }
      .progress-copy { align-items: flex-start; font-size: .78rem; }
      .progress-copy span:first-child { white-space: normal; overflow-wrap: anywhere; }
      .track { height: 9px; margin-top: 9px; }
      .card-header { margin: -3px 0 10px; }
      .refresh { min-width: 94px; min-height: 44px; }
      .file-list { gap: 8px; }
      .file-item {
        display: grid; grid-template-columns: minmax(0, 1fr); gap: 11px;
        align-items: stretch; padding: 12px; border-radius: 9px;
      }
      .file-info { align-items: flex-start; gap: 10px; }
      .file-icon { padding-top: 1px; font-size: 1.4rem; }
      .file-name {
        display: -webkit-box; line-height: 1.35; white-space: normal; overflow-wrap: anywhere;
        -webkit-box-orient: vertical; -webkit-line-clamp: 2;
      }
      .file-meta { margin-top: 5px; }
      .actions { width: 100%; gap: 8px; }
      .actions > * {
        min-height: 46px; flex: 1; display: inline-flex; align-items: center;
        justify-content: center; padding: 10px 12px; text-align: center;
      }
      .empty, .error { padding: 28px 12px; }
    }
    @media (max-width: 360px) {
      body { padding-left: calc(8px + env(safe-area-inset-left)); padding-right: calc(8px + env(safe-area-inset-right)); }
      .card { padding: 11px; }
      .drop-zone { min-height: 150px; padding: 20px 10px; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      body { padding-top: max(12px, env(safe-area-inset-top)); }
      .container { width: min(980px, 100%); }
      header { flex-direction: row; align-items: center; }
      .badge { width: auto; max-width: 58%; }
      .drop-zone { min-height: 112px; padding-top: 14px; padding-bottom: 14px; }
      .upload-icon { margin-bottom: 2px; font-size: 1.9rem; }
    }
    @media (hover: none) {
      .card {
        background: var(--card-mobile);
        -webkit-backdrop-filter: none; backdrop-filter: none;
      }
      .drop-zone:hover { border-color: rgba(255,255,255,.16); background: transparent; }
      .primary:hover { background: var(--accent); }
      .danger:hover { background: rgba(239,68,68,.12); color: #ff7777; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>LAN <span>传输助手</span></h1>
      <button class="badge" id="serverAddress" type="button" title="点击复制访问地址" aria-live="polite">正在连接……</button>
    </header>

    <section class="card">
      <div class="drop-zone" id="dropZone" tabindex="0" role="button" aria-label="选择要上传的文件">
        <div class="upload-icon">⇧</div>
        <div class="upload-title">点击选择文件</div>
        <div class="upload-desc">电脑也可拖放；支持多文件依次上传</div>
        <input type="file" id="fileInput" multiple>
      </div>
      <div class="progress" id="progress">
        <div class="progress-copy">
          <span id="progressStatus">正在上传……</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="track"><div class="fill" id="progressFill"></div></div>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <div class="card-title">共享文件</div>
        <button class="refresh" id="refreshButton">↻ 刷新列表</button>
      </div>
      <div class="file-list" id="fileList"><div class="empty">正在加载……</div></div>
    </section>
  </main>

  <script>
    const elements = {
      address: document.getElementById('serverAddress'),
      dropZone: document.getElementById('dropZone'),
      fileInput: document.getElementById('fileInput'),
      list: document.getElementById('fileList'),
      progress: document.getElementById('progress'),
      status: document.getElementById('progressStatus'),
      percent: document.getElementById('progressPercent'),
      fill: document.getElementById('progressFill')
    };

    document.getElementById('refreshButton').addEventListener('click', fetchFiles);
    elements.address.addEventListener('click', copyServerAddress);
    elements.dropZone.addEventListener('click', () => elements.fileInput.click());
    elements.dropZone.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        elements.fileInput.click();
      }
    });
    elements.fileInput.addEventListener('change', () => uploadFiles(elements.fileInput.files));
    elements.dropZone.addEventListener('dragover', event => {
      event.preventDefault();
      elements.dropZone.classList.add('dragover');
    });
    elements.dropZone.addEventListener('dragleave', () => elements.dropZone.classList.remove('dragover'));
    elements.dropZone.addEventListener('drop', event => {
      event.preventDefault();
      elements.dropZone.classList.remove('dragover');
      uploadFiles(event.dataTransfer.files);
    });

    async function fetchServerInfo() {
      try {
        const response = await fetch('/api/ip', {cache: 'no-store'});
        if (!response.ok) throw new Error('获取服务地址失败');
        const data = await response.json();
        elements.address.dataset.url = data.url;
        elements.address.textContent = data.url;
        elements.address.title = `监听服务：${data.url}`;
      } catch (error) {
        delete elements.address.dataset.url;
        elements.address.textContent = '局域网服务';
      }
    }

    async function copyServerAddress() {
      const address = elements.address.dataset.url;
      if (!address) return;
      try {
        await navigator.clipboard.writeText(address);
        elements.address.textContent = '已复制访问地址';
        setTimeout(() => { elements.address.textContent = address; }, 1200);
      } catch (error) {
        window.prompt('复制下面的访问地址：', address);
      }
    }

    async function fetchFiles() {
      try {
        const response = await fetch('/api/files', {cache: 'no-store'});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        renderFiles(await response.json());
      } catch (error) {
        elements.list.replaceChildren(makeMessage(`加载失败：${error.message}`, 'error'));
      }
    }

    function makeMessage(text, className) {
      const node = document.createElement('div');
      node.className = className;
      node.textContent = text;
      return node;
    }

    function formatSize(bytes) {
      if (!bytes) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      return `${(bytes / (1024 ** index)).toFixed(index ? 2 : 0)} ${units[index]}`;
    }

    function fileIcon(filename) {
      const ext = filename.includes('.') ? filename.split('.').pop().toLowerCase() : '';
      if (['jpg','jpeg','png','gif','webp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mkv','avi','mov','webm'].includes(ext)) return '🎬';
      if (['pdf','doc','docx','xls','xlsx','txt','md'].includes(ext)) return '📄';
      if (['zip','rar','7z','tar','gz'].includes(ext)) return '📦';
      return '📁';
    }

    function renderFiles(files) {
      elements.list.replaceChildren();
      if (!files.length) {
        elements.list.append(makeMessage('暂无共享文件', 'empty'));
        return;
      }

      for (const file of files) {
        const item = document.createElement('div');
        item.className = 'file-item';

        const info = document.createElement('div');
        info.className = 'file-info';
        const icon = document.createElement('div');
        icon.className = 'file-icon';
        icon.textContent = fileIcon(file.name);
        const details = document.createElement('div');
        details.className = 'file-details';
        const name = document.createElement('span');
        name.className = 'file-name';
        name.textContent = file.name;
        name.title = file.name;
        const meta = document.createElement('div');
        meta.className = 'file-meta';
        meta.textContent = `${formatSize(file.size)} · ${file.date}`;
        details.append(name, meta);
        info.append(icon, details);

        const actions = document.createElement('div');
        actions.className = 'actions';
        const download = document.createElement('a');
        download.className = 'button primary';
        download.textContent = '下载';
        download.href = `/download/${encodeURIComponent(file.name)}`;
        download.setAttribute('download', file.name);
        const remove = document.createElement('button');
        remove.className = 'danger';
        remove.textContent = '删除';
        remove.addEventListener('click', () => deleteFile(file.name, remove));
        actions.append(download, remove);

        item.append(info, actions);
        elements.list.append(item);
      }
    }

    async function uploadFiles(fileList) {
      const files = Array.from(fileList || []);
      if (!files.length) return;
      elements.progress.style.display = 'block';

      try {
        for (let index = 0; index < files.length; index++) {
          await uploadOne(files[index], index, files.length);
        }
        elements.status.textContent = '上传完成';
        elements.fill.style.background = 'var(--success)';
        await fetchFiles();
        setTimeout(resetProgress, 900);
      } catch (error) {
        elements.status.textContent = `上传失败：${error.message}`;
        elements.fill.style.background = 'var(--danger)';
      } finally {
        elements.fileInput.value = '';
      }
    }

    function uploadOne(file, index, total) {
      return new Promise((resolve, reject) => {
        const request = new XMLHttpRequest();
        request.open('POST', `/upload?filename=${encodeURIComponent(file.name)}`);
        elements.status.textContent = `正在上传 (${index + 1}/${total})：${file.name}`;
        elements.fill.style.background = 'var(--accent)';
        elements.fill.style.width = '0%';
        elements.percent.textContent = '0%';

        request.upload.onprogress = event => {
          if (!event.lengthComputable) return;
          const percent = Math.round(event.loaded / event.total * 100);
          elements.fill.style.width = `${percent}%`;
          elements.percent.textContent = `${percent}%`;
        };
        request.onload = () => {
          if (request.status === 200) resolve();
          else {
            try { reject(new Error(JSON.parse(request.responseText).message)); }
            catch { reject(new Error(`HTTP ${request.status}`)); }
          }
        };
        request.onerror = () => reject(new Error('网络连接中断'));
        request.send(file);
      });
    }

    function resetProgress() {
      elements.progress.style.display = 'none';
      elements.fill.style.width = '0%';
      elements.fill.style.background = 'var(--accent)';
    }

    async function deleteFile(filename, button) {
      button.disabled = true;
      try {
        const response = await fetch('/delete', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({filename})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || `HTTP ${response.status}`);
        await fetchFiles();
      } catch (error) {
        button.disabled = false;
        alert(`删除失败：${error.message}`);
      }
    }

    fetchServerInfo();
    fetchFiles();

    if (new URLSearchParams(location.search).has('managed')) {
      let failedHealthChecks = 0;
      const healthTimer = setInterval(async () => {
        try {
          const response = await fetch('/api/ip', {cache: 'no-store'});
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          failedHealthChecks = 0;
        } catch (error) {
          failedHealthChecks += 1;
          if (failedHealthChecks >= 2) {
            clearInterval(healthTimer);
            window.close();
            document.body.replaceChildren(makeMessage('服务已关闭，可以关闭此窗口', 'empty'));
          }
        }
      }, 1500);
    }
  </script>
</body>
</html>
